<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NO ROLL studio — AI cinematic production + design</title>
  <meta name="description" content="NO ROLL studio — AI cinematic production for cinema, TV and YouTube, plus brand and visual design. Made right on the first roll.">
  <meta name="theme-color" content="#ff5700">
  <meta property="og:title" content="NO ROLL studio">
  <meta property="og:description" content="AI cinematic production + visual design. Made right on the first roll.">
  <meta property="og:image" content="assets/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@200;300;400;500;600;900&family=Unbounded:wght@800&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/img/dog-fire.webp" as="image">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body data-view="home">
  <div class="loader" aria-hidden="true">NO ROLL STUDIO.</div>
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- unrolled film strips, shown beside the works column -->
  <div class="strip strip--cinematic" aria-hidden="true"><div class="strip__track"></div></div>
  <div class="strip strip--design" aria-hidden="true"><div class="strip__track"></div></div>

  <a class="logo" href="./" data-nav="home" aria-label="NO ROLL studio, home">
    <span class="logo__mark">NR</span>
    <span class="logo__word">NO&nbsp;ROLL&nbsp;STUDIO.</span>
  </a>

  <p class="hero">AI cinematic production +<br>visual design. Made right<br>on the first roll.</p>

  <dl class="hud" aria-label="Scene controls">
    <div><dt id="hud-rewind-label">Rewind</dt><dd><button type="button" data-key="rewind">[Space]</button></dd></div>
  </dl>

  <button class="now-playing" type="button" data-open-work="rb-cinema" aria-label="Open RB Cinema Spot">
    <span class="now-playing__label">Now Playing</span>
    <span class="now-playing__screen">
      <iframe title="RB Cinema Spot preview" src="https://player.vimeo.com/video/1193051888?background=1&muted=1&loop=1&dnt=1" allow="autoplay; fullscreen" loading="lazy" tabindex="-1"></iframe>
    </span>
  </button>

  <nav class="bottom" aria-label="Sections">
    <button class="side-label side-label--left" type="button" data-nav="cinematic"><span class="side-label__text">Cinematic</span></button>
    <button class="view-works" type="button" data-nav="cinematic">View Works</button>
    <button class="side-label side-label--right" type="button" data-nav="design"><span class="side-label__text">Design</span></button>
  </nav>

  <!-- the works column -->
  <section class="column" id="column" aria-live="polite" hidden>
    <div class="column__scroll" id="column-scroll">
      <header class="column__head">
        <div class="column__bar">
          <h1 class="column__title">Works <span>_</span> <button type="button" class="column__switch" id="column-switch"></button></h1>
          <button class="column__close" type="button" data-nav="home" aria-label="Close">
            <svg viewBox="0 0 24 24" width="30" height="30"><path d="M3 3l18 18M21 3L3 21" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
          </button>
        </div>
        <div class="counter" aria-hidden="true"><span id="count-a">01</span><i></i><span id="count-b">07</span></div>
      </header>
      <ol class="works" id="works"></ol>
      <article class="work" id="work"></article>
    </div>
    <button class="back" type="button" id="back">View Other Works</button>
  </section>

  <noscript>
    <div class="noscript">
      <h1>NO ROLL studio</h1>
      <p>AI cinematic production + visual design. Turn on JavaScript to see the work, or write to hello@noroll.studio.</p>
    </div>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
